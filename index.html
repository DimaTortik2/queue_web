<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Очереди</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0d0b09;
      }
      .perspective-container {
        perspective: 800px;
      }
      .circle-loader {
        transform-origin: center;
        animation: rotate-coin 3s linear infinite;
        will-change: transform;
      }
      @keyframes rotate-coin {
        0% {
          transform: rotateX(0deg) rotateY(0deg);
        }
        45% {
          transform: rotateX(70deg) rotateY(50deg);
        }
        50%,
        52% {
          transform: rotateX(75deg) rotateY(55deg);
        }
        100% {
          transform: rotateX(0deg) rotateY(0deg);
        }
      }
      .full-page-wrapper {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #0d0b09;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .loader-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        animation: fade-in 1s ease-out 0.5s forwards;
      }

      @keyframes fade-in {
        to {
          opacity: 1;
        }
      }
      .loader-container svg {
        width: calc((1vh + 1vw) * 15);
        height: calc((1vh + 1vw) * 15);
        color: #632adc;
      }
    </style>
  </head>
  <body class="bg-background text-foreground antialiased font-sans select-none">
    <div id="root">
      <div class="full-page-wrapper perspective-container">
        <div class="loader-container">
          <svg viewBox="0 0 200 200" stroke="currentColor">
            <circle
              cx="100"
              cy="100"
              r="80"
              fill="none"
              stroke-width="4"
              class="circle-loader"
            />
          </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
